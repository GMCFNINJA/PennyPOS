
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PennyPOS — Brevemente</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="https://raw.githubusercontent.com/GMCFNINJA/PennyPOS/refs/heads/main/img/logo/logo.png"
    >

    <!-- Fonte BBH Bartle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background-color: #000;
            color: #fff;

            font-family: 'BBH Bartle', sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        .logo {
            width: min(70vw, 360px);
            max-height: 55vh;
            object-fit: contain;
            display: block;

            /* Logótipo completamente branco */
            filter: brightness(0) invert(1);
        }

        .texto {
            margin-top: 24px;
            font-family: 'BBH Bartle', sans-serif;
            font-size: clamp(16px, 4vw, 28px);
            font-weight: 400;
            letter-spacing: 3px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .logo {
                width: min(75vw, 300px);
            }

            .texto {
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <img
        class="logo"
        src="https://raw.githubusercontent.com/GMCFNINJA/PennyPOS/refs/heads/main/img/logo/logo.png"
        alt="PennyPOS"
    >

    <p class="texto">BREVEMENTE…</p>

</body>
</html>
