
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PennyPOS — Brevemente</title>

    <!-- Favicon original -->
    <link
        rel="icon"
        type="image/png"
        href="https://raw.githubusercontent.com/GMCFNINJA/PennyPOS/refs/heads/main/img/logo/logo.png"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 20px;
        }

        .logo {
            width: min(70vw, 360px);
            max-height: 55vh;
            object-fit: contain;
            display: block;

            /* Transforma o logótipo em branco */
            filter: brightness(0) invert(1);
        }

        .texto {
            margin-top: 24px;
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 700;
            letter-spacing: 5px;
        }
    </style>
</head>

<body>

    <img
        class="logo"
        src="https://raw.githubusercontent.com/GMCFNINJA/PennyPOS/refs/heads/main/img/logo/logo.png"
        alt="PennyPOS"
    >

    <p class="texto">BREVEMENTE…</p>

</body>
</html>
